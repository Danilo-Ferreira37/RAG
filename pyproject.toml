[project]
name = "RAG"
version = "1.0"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy",
    "pydantic",
    "flake8",
    "mypy",
    "bm25s",
    "langchain-text-splitters>=1.1.3",
    "fire>=0.7.1",
    "transformers>=5.21.0",
    "pytouch>=0.4.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]
[tool.mypy]
warn_return_any=true
warn_unused_ignores=true
ignore_missing_imports=true
disallow_untyped_defs=true
check_untyped_defs=true
exclude = [
    "data/",
    ".venv/"
]
